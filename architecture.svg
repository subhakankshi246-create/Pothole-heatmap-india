<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RoadWatch Architecture Diagram</title>
<desc>RoadWatch system architecture showing 4 layers: detection, road intelligence, risk scoring, and alert generation</desc>

<style>
  text { font-family: Arial, sans-serif; fill: #1a1a1a; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; fill: #444; }
  .box-teal   { fill: #E1F5EE; stroke: #0F6E56; }
  .box-blue   { fill: #E6F1FB; stroke: #185FA5; }
  .box-amber  { fill: #FAEEDA; stroke: #854F0B; }
  .box-green  { fill: #EAF3DE; stroke: #3B6D11; }
  .box-coral  { fill: #FAECE7; stroke: #993C1D; }
  .box-gray   { fill: #F1EFE8; stroke: #5F5E5A; }
  .badge-teal  { fill: #0F6E56; }
  .badge-blue  { fill: #185FA5; }
  .badge-amber { fill: #854F0B; }
  .badge-text  { fill: #fff; font-size: 11px; font-family: Arial, sans-serif; }
  .arr { stroke: #888; stroke-width: 1; fill: none; marker-end: url(#arrow); }
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- INPUT -->
<rect class="box-gray" x="210" y="20" width="260" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Dashcam / phone camera</text>
<text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">Crowdsourced video frames + GPS</text>

<line x1="340" y1="72" x2="340" y2="106" class="arr"/>

<!-- LAYER 1 -->
<rect class="box-teal" x="130" y="108" width="420" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central">Layer 1 — Pothole detection</text>
<text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central">YOLOv8n · mAP50: 0.396 · Precision: 54.5% · On-device, offline-capable</text>

<line x1="340" y1="180" x2="340" y2="214" class="arr"/>

<!-- LAYER 2 -->
<rect class="box-blue" x="80" y="216" width="520" height="88" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">Layer 2 — Road intelligence</text>
<text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">Road type: NH / SH / MDR / Rural</text>
<text class="ts" x="340" y="276" text-anchor="middle" dominant-baseline="central">Contractor · Last relaying date · Budget sanctioned vs spent</text>
<text class="ts" x="340" y="294" text-anchor="middle" dominant-baseline="central">Source: data.gov.in · MoRTH open datasets</text>

<line x1="340" y1="304" x2="340" y2="338" class="arr"/>

<!-- LAYER 3 -->
<rect class="box-amber" x="80" y="340" width="520" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="362" text-anchor="middle" dominant-baseline="central">Layer 3 — Predictive risk scoring</text>
<text class="ts" x="340" y="382" text-anchor="middle" dominant-baseline="central">Random Forest · AUC-ROC: 0.639 · Labels: CRITICAL / HIGH / MONITOR</text>
<text class="ts" x="340" y="398" text-anchor="middle" dominant-baseline="central">9 pavement features · Validated: Abed et al. (2023)</text>

<!-- Split arrow -->
<line x1="340" y1="412" x2="340" y2="436" stroke="#888" stroke-width="1" fill="none"/>
<line x1="220" y1="436" x2="460" y2="436" stroke="#888" stroke-width="1" fill="none"/>
<line x1="220" y1="436" x2="220" y2="458" class="arr"/>
<line x1="460" y1="436" x2="460" y2="458" class="arr"/>

<!-- HEATMAP -->
<rect class="box-green" x="60" y="460" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="210" y="482" text-anchor="middle" dominant-baseline="central">Priority heatmap</text>
<text class="ts" x="210" y="500" text-anchor="middle" dominant-baseline="central">Folium / Leaflet · Browser-based · No login</text>

<!-- LAYER 4 -->
<rect class="box-coral" x="380" y="460" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="482" text-anchor="middle" dominant-baseline="central">Layer 4 — Auto PWD alert</text>
<text class="ts" x="500" y="500" text-anchor="middle" dominant-baseline="central">Motor Vehicles Act 1988 · Routed by road type</text>

<!-- Authority -->
<line x1="500" y1="516" x2="500" y2="540" class="arr"/>
<rect class="box-gray" x="340" y="542" width="320" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="562" text-anchor="middle" dominant-baseline="central">Correct authority by road type</text>
<text class="ts" x="500" y="580" text-anchor="middle" dominant-baseline="central">NHAI · State PWD · District Collector · Gram Panchayat</text>

<!-- Badges -->
<rect class="badge-teal" x="20" y="108" width="94" height="26" rx="13"/>
<text class="badge-text" x="67" y="121" text-anchor="middle" dominant-baseline="central">Offline-capable</text>

<rect class="badge-blue" x="20" y="216" width="56" height="26" rx="13"/>
<text class="badge-text" x="48" y="229" text-anchor="middle" dominant-baseline="central">SQLite</text>

<rect class="badge-amber" x="20" y="340" width="58" height="26" rx="13"/>
<text class="badge-text" x="49" y="353" text-anchor="middle" dominant-baseline="central">sklearn</text>

</svg>
